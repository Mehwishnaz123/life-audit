name: Take phone and laptop screenshots of the live site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i playwright@1 && npx playwright install --with-deps chromium
      - name: Screenshots
        run: |
          cat > shots.mjs <<'JS'
          import { chromium } from 'playwright';
          const site = 'https://lifeaudit-app.netlify.app';
          const pages = ['/', '/features', '/pricing', '/faq', '/about', '/login', '/signup'];
          const b = await chromium.launch();
          for (const [name, vp] of [['phone', { width: 390, height: 844 }], ['laptop', { width: 1366, height: 800 }]]) {
            const p = await b.newPage({ viewport: vp, deviceScaleFactor: 1 });
            for (const path of pages) {
              await p.goto(site + path, { waitUntil: 'networkidle' });
              await p.waitForTimeout(1500);
              await p.screenshot({ path: `${name}${path === '/' ? '-home' : path.replace(/\//g, '-')}.jpg`, fullPage: true, quality: 60, type: 'jpeg' });
            }
          }
          await b.close();
          JS
          node shots.mjs
      - name: Save screenshots to the 'screenshots' branch
        run: |
          mkdir out && mv *.jpg out/ && cd out
          git init -q -b screenshots && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "Screenshots"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
