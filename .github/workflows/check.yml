name: Check the app builds
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Open every page and check it works
        run: |
          npx next start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3000 && break; sleep 1; done
          fail=0
          for p in / /features /pricing /faq /about /privacy /terms /login /signup /forgot-password /reset-password /sitemap.xml /robots.txt /manifest.webmanifest /icon.svg; do
            code=$(curl -s -o page.html -w '%{http_code}' http://localhost:3000$p)
            echo "$code  $p"
            if [ "$code" != "200" ]; then fail=1; fi
            if grep -qi "Application error\|Internal Server Error" page.html; then echo "  ^ shows an error"; fail=1; fi
          done
          for p in /app /app/day /app/coach /app/planner /admin; do
            code=$(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' http://localhost:3000$p)
            echo "$code  $p (should send visitors to login)"
            case "$code" in 30*login*) ;; *) fail=1;; esac
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/does-not-exist); echo "$code  /does-not-exist (should be 404)"
          [ "$code" = "404" ] || fail=1
          echo "---- server log ----"; cat server.log
          exit $fail
